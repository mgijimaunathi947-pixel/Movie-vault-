name: Build MovieVault Volume 2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Create Volume 2 project
        run: |
          mkdir -p MovieVaultV2/app/src/main/java/com/movievault/v2
          mkdir -p MovieVaultV2/app/src/main/res/drawable
          mkdir -p MovieVaultV2/app/src/main/res/mipmap-hdpi
          mkdir -p MovieVaultV2/app/src/main/res/mipmap-mdpi
          mkdir -p MovieVaultV2/app/src/main/res/mipmap-xhdpi
          mkdir -p MovieVaultV2/app/src/main/res/mipmap-xxhdpi
          mkdir -p MovieVaultV2/app/src/main/res/mipmap-xxxhdpi

          cat > MovieVaultV2/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MovieVaultV2"
          include(":app")
          EOF

          cat > MovieVaultV2/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > MovieVaultV2/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.movievault.v2"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.movievault.v2"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.0"
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

          cat > MovieVaultV2/app/src/main/res/values.xml <<'EOF'
          EOF

          cat > MovieVaultV2/app/src/main/res/drawable/movie_vault_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#121212"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#D4AF37"
                  android:pathData="M54,18a36,36 0,1 0,0 72a36,36 0,1 0,0 -72" />
              <path
                  android:fillColor="#121212"
                  android:pathData="M54,25a29,29 0,1 0,0 58a29,29 0,1 0,0 -58" />
              <path
                  android:fillColor="#D4AF37"
                  android:pathData="M39,45h30v25h-30z" />
              <path
                  android:fillColor="#121212"
                  android:pathData="M44,48h20v19h-20z" />
              <path
                  android:fillColor="#D4AF37"
                  android:pathData="M48,55a6,6 0,1 0,12 0a6,6 0,1 0,-12 0" />
              <path
                  android:fillColor="#121212"
                  android:pathData="M52,55h4v9h-4z" />
          </vector>
          EOF

          cat > MovieVaultV2/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="Movie Vault"
                  android:theme="@style/Theme.MovieVault">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          mkdir -p MovieVaultV2/app/src/main/res/values

          cat > MovieVaultV2/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.MovieVault" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0D0D0D</item>
                  <item name="android:navigationBarColor">#0D0D0D</item>
              </style>
          </resources>
          EOF

          cat > MovieVaultV2/app/src/main/java/com/movievault/v2/MainActivity.kt <<'EOF'
          package com.movievault.v2

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          private val Black = Color(0xFF0D0D0D)
          private val Charcoal = Color(0xFF171717)
          private val Card = Color(0xFF202020)
          private val Gold = Color(0xFFD4AF37)
          private val SoftGold = Color(0xFFE4C766)
          private val White = Color(0xFFF5F5F5)
          private val Grey = Color(0xFFAAAAAA)

          data class Movie(
              val title: String,
              val year: String,
              val genre: String,
              val runtime: String,
              val description: String,
              val free: Boolean = false
          )

          val movies = listOf(
              Movie(
                  "Big Buck Bunny",
                  "2008",
                  "Animation • Comedy",
                  "10 min",
                  "A giant rabbit gets into trouble after three mischievous rodents disturb his peaceful day.",
                  true
              ),
              Movie(
                  "Sintel",
                  "2010",
                  "Fantasy • Animation",
                  "15 min",
                  "A young warrior begins a journey to find a dragon she has raised from a hatchling.",
                  true
              ),
              Movie(
                  "Tears of Steel",
                  "2012",
                  "Sci-Fi • Drama",
                  "12 min",
                  "A group of scientists and soldiers attempt to save Amsterdam from a dangerous robotic threat.",
                  true
              ),
              Movie(
                  "The Dark Knight",
                  "2008",
                  "Action • Crime",
                  "152 min",
                  "A masked hero faces a criminal mastermind who pushes Gotham into chaos."
              ),
              Movie(
                  "Titanic",
                  "1997",
                  "Drama • Romance",
                  "195 min",
                  "A romance unfolds aboard the legendary ocean liner during its maiden voyage."
              ),
              Movie(
                  "Avatar",
                  "2009",
                  "Sci-Fi • Fantasy",
                  "162 min",
                  "A marine on an alien world becomes caught between two very different ways of life."
              ),
              Movie(
                  "Black Panther",
                  "2018",
                  "Action • Fantasy",
                  "134 min",
                  "A new king must protect his nation while confronting a powerful challenger."
              )
          )

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MovieVaultApp()
                  }
              }
          }

          @Composable
          fun MovieVaultApp() {
              var screen by remember { mutableStateOf("home") }
              var selectedMovie by remember { mutableStateOf<Movie?>(null) }
              var searchText by remember { mutableStateOf("") }
              var savedMovies by remember { mutableStateOf(setOf<String>()) }

              MaterialTheme(
                  colorScheme = darkColorScheme(
                      primary = Gold,
                      background = Black,
                      surface = Charcoal,
                      onPrimary = Black,
                      onBackground = White,
                      onSurface = White
                  )
              ) {
                  Surface(
                      modifier = Modifier.fillMaxSize(),
                      color = Black
                  ) {
                      if (selectedMovie != null) {
                          DetailsScreen(
                              movie = selectedMovie!!,
                              saved = savedMovies.contains(selectedMovie!!.title),
                              onBack = { selectedMovie = null },
                              onSave = {
                                  savedMovies =
                                      if (savedMovies.contains(selectedMovie!!.title))
                                          savedMovies - selectedMovie!!.title
                                      else
                                          savedMovies + selectedMovie!!.title
                              }
                          )
                      } else {
                          Column(modifier = Modifier.fillMaxSize()) {
                              Box(modifier = Modifier.weight(1f)) {
                                  when (screen) {
                                      "home" -> HomeScreen(
                                          onMovieClick = { selectedMovie = it },
                                          onSearch = { screen = "search" }
                                      )

                                      "search" -> SearchScreen(
                                          searchText = searchText,
                                          onSearchChange = { searchText = it },
                                          onMovieClick = { selectedMovie = it }
                                      )

                                      "list" -> MyListScreen(
                                          savedMovies = movies.filter { savedMovies.contains(it.title) },
                                          onMovieClick = { selectedMovie = it }
                                      )

                                      "downloads" -> DownloadsScreen(
                                          onExplore = { screen = "home" }
                                      )

                                      "more" -> MoreScreen(
                                          onBrowse = { screen = "browse" },
                                          onAbout = { screen = "about" }
                                      )

                                      "browse" -> BrowseScreen(
                                          onMovieClick = { selectedMovie = it }
                                      )

                                      "about" -> AboutScreen()
                                  }
                              }

                              BottomNavigationBar(
                                  current = screen,
                                  onNavigate = { screen = it }
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          fun BrandHeader(
              onSearch: () -> Unit,
              title: String = "MOVIE VAULT"
          ) {
              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(horizontal = 20.dp, vertical = 18.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.SpaceBetween
              ) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Box(
                          modifier = Modifier
                              .size(42.dp)
                              .clip(RoundedCornerShape(12.dp))
                              .background(Gold),
                          contentAlignment = Alignment.Center
                      ) {
                          Icon(
                              Icons.Default.Lock,
                              contentDescription = null,
                              tint = Black
                          )
                      }

                      Spacer(Modifier.width(12.dp))

                      Column {
                          Text(
                              title,
                              color = White,
                              fontSize = 18.sp,
                              fontWeight = FontWeight.Bold,
                              letterSpacing = 2.sp
                          )
                          Text(
                              "YOUR CINEMA SPACE",
                              color = Gold,
                              fontSize = 8.sp,
                              letterSpacing = 2.sp
                          )
                      }
                  }

                  IconButton(onClick = onSearch) {
                      Icon(
                          Icons.Default.Search,
                          contentDescription = "Search",
                          tint = White
                      )
                  }
              }
          }

          @Composable
          fun HomeScreen(
              onMovieClick: (Movie) -> Unit,
              onSearch: () -> Unit
          ) {
              LazyColumn(
                  modifier = Modifier.fillMaxSize(),
                  contentPadding = PaddingValues(bottom = 24.dp)
              ) {
                  item {
                      BrandHeader(onSearch = onSearch)
                  }

                  item {
                      HeroMovie(
                          movie = movies[0],
                          onClick = { onMovieClick(movies[0]) }
                      )
                  }

                  item {
                      SectionTitle("🔥 Trending Now")
                  }

                  item {
                      MovieRow(
                          movies = movies.drop(3).take(4),
                          onMovieClick = onMovieClick
                      )
                  }

                  item {
                      SectionTitle("MOVIE VAULT PICKS")
                  }

                  item {
                      MovieRow(
                          movies = movies.take(3),
                          onMovieClick = onMovieClick
                      )
                  }

                  item {
                      SectionTitle("⬇ FREE & LEGAL DOWNLOADS")
                  }

                  item {
                      MovieRow(
                          movies = movies.filter { it.free },
                          onMovieClick = onMovieClick
                      )
                  }
              }
          }

          @Composable
          fun HeroMovie(
              movie: Movie,
              onClick: () -> Unit
          ) {
              Box(
                  modifier = Modifier
                      .fillMaxWidth()
                      .height(330.dp)
                      .padding(horizontal = 16.dp)
                      .clip(RoundedCornerShape(22.dp))
                      .background(Card)
                      .clickable { onClick() }
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(24.dp),
                      verticalArrangement = Arrangement.Bottom
                  ) {
                      Text(
                          "FEATURED",
                          color = Gold,
                          fontSize = 11.sp,
                          fontWeight = FontWeight.Bold,
                          letterSpacing = 2.sp
                      )

                      Spacer(Modifier.height(8.dp))

                      Text(
                          movie.title,
                          color = White,
                          fontSize = 32.sp,
                          fontWeight = FontWeight.ExtraBold
                      )

                      Spacer(Modifier.height(5.dp))

                      Text(
                          "${movie.year}  •  ${movie.genre}",
                          color = Grey,
                          fontSize = 13.sp
                      )

                      Spacer(Modifier.height(8.dp))

                      Text(
                          movie.description,
                          color = White.copy(alpha = .82f),
                          fontSize = 13.sp,
                          maxLines = 2,
                          overflow = TextOverflow.Ellipsis
                      )

                      Spacer(Modifier.height(16.dp))

                      Row {
                          GoldButton(
                              text = "WATCH",
                              icon = Icons.Default.PlayArrow,
                              onClick = onClick
                          )

                          Spacer(Modifier.width(10.dp))

                          OutlinedButton(
                              onClick = onClick,
                              colors = ButtonDefaults.outlinedButtonColors(
                                  contentColor = White
                              ),
                              border = ButtonDefaults.outlinedButtonBorder.copy(
                                  brush = androidx.compose.ui.graphics.Brush.linearGradient(
                                      listOf(Gold, Gold)
                                  )
                              )
                          ) {
                              Icon(Icons.Default.Add, null)
                              Spacer(Modifier.width(5.dp))
                              Text("MY LIST")
                          }
                      }
                  }
              }
          }

          @Composable
          fun SectionTitle(text: String) {
              Text(
                  text,
                  modifier = Modifier.padding(
                      start = 20.dp,
                      top = 28.dp,
                      bottom = 14.dp
                  ),
                  color = White,
                  fontSize = 16.sp,
                  fontWeight = FontWeight.Bold,
                  letterSpacing = 1.sp
              )
          }

          @Composable
          fun MovieRow(
              movies: List<Movie>,
              onMovieClick: (Movie) -> Unit
          ) {
              LazyRow(
                  contentPadding = PaddingValues(horizontal = 20.dp),
                  horizontalArrangement = Arrangement.spacedBy(14.dp)
              ) {
                  items(movies) { movie ->
                      MovieCard(movie, onMovieClick)
                  }
              }
          }

          @Composable
          fun MovieCard(
              movie: Movie,
              onMovieClick: (Movie) -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .width(145.dp)
                      .clickable { onMovieClick(movie) }
              ) {
                  Box(
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(205.dp)
                          .clip(RoundedCornerShape(14.dp))
                          .background(Card),
                      contentAlignment = Alignment.Center
                  ) {
                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          Icon(
                              Icons.Default.Movie,
                              contentDescription = null,
                              tint = Gold,
                              modifier = Modifier.size(42.dp)
                          )
                          Spacer(Modifier.height(8.dp))
                          Text(
                              movie.title,
                              color = White,
                              fontSize = 12.sp,
                              fontWeight = FontWeight.Bold,
                              maxLines = 2,
                              overflow = TextOverflow.Ellipsis,
                              modifier = Modifier.padding(horizontal = 10.dp)
                          )
                      }

                      if (movie.free) {
                          Surface(
                              modifier = Modifier
                                  .align(Alignment.TopStart)
                                  .padding(8.dp),
                              shape = RoundedCornerShape(5.dp),
                              color = Gold
                          ) {
                              Text(
                                  "FREE",
                                  color = Black,
                                  fontSize = 8.sp,
                                  fontWeight = FontWeight.Bold,
                                  modifier = Modifier.padding(
                                      horizontal = 7.dp,
                                      vertical = 4.dp
                                  )
                              )
                          }
                      }
                  }

                  Spacer(Modifier.height(8.dp))

                  Text(
                      movie.title,
                      color = White,
                      fontSize = 13.sp,
                      fontWeight = FontWeight.SemiBold,
                      maxLines = 1,
                      overflow = TextOverflow.Ellipsis
                  )

                  Text(
                      "${movie.year} • ${movie.genre.split(" • ")[0]}",
                      color = Grey,
                      fontSize = 10.sp
                  )
              }
          }

          @Composable
          fun SearchScreen(
              searchText: String,
              onSearchChange: (String) -> Unit,
              onMovieClick: (Movie) -> Unit
          ) {
              val results = if (searchText.isBlank()) {
                  movies
              } else {
                  movies.filter {
                      it.title.contains(searchText, true) ||
                              it.genre.contains(searchText, true) ||
                              it.year.contains(searchText)
                  }
              }

              LazyColumn(
                  modifier = Modifier.fillMaxSize(),
                  contentPadding = PaddingValues(bottom = 30.dp)
              ) {
                  item {
                      BrandHeader(
                          onSearch = {},
                          title = "SEARCH"
                      )
                  }

                  item {
                      OutlinedTextField(
                          value = searchText,
                          onValueChange = onSearchChange,
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(horizontal = 20.dp),
                          placeholder = {
                              Text(
                                  "Search movies, actors, genres...",
                                  color = Grey
                              )
                          },
                          leadingIcon = {
                              Icon(Icons.Default.Search, null, tint = Gold)
                          },
                          trailingIcon = {
                              if (searchText.isNotEmpty()) {
                                  IconButton(
                                      onClick = { onSearchChange("") }
                                  ) {
                                      Icon(Icons.Default.Clear, null)
                                  }
                              }
                          },
                          singleLine = true,
                          colors = OutlinedTextFieldDefaults.colors(
                              focusedBorderColor = Gold,
                              unfocusedBorderColor = Color.DarkGray,
                              focusedTextColor = White,
                              unfocusedTextColor = White
                          ),
                          shape = RoundedCornerShape(14.dp)
                      )
                  }

                  item {
                      SectionTitle(
                          if (searchText.isBlank())
                              "BROWSE BY GENRE"
                          else
                              "RESULTS FOR \"$searchText\""
                      )
                  }

                  if (searchText.isBlank()) {
                      item {
                          GenreChips()
                      }

                      item {
                          SectionTitle("POPULAR SEARCHES")
                      }

                      item {
                          Text(
                              "The Dark Knight     Titanic     Spider-Man\nAvatar     Black Panther",
                              color = Grey,
                              lineHeight = 28.sp,
                              modifier = Modifier.padding(horizontal = 20.dp)
                          )
                      }
                  }

                  items(results) { movie ->
                      SearchMovieCard(
                          movie = movie,
                          onClick = { onMovieClick(movie) }
                      )
                  }
              }
          }

          @Composable
          fun GenreChips() {
              val genres = listOf(
                  "Action", "Comedy", "Drama", "Horror",
                  "Romance", "Sci-Fi", "Animation",
                  "Thriller", "Documentary"
              )

              LazyRow(
                  contentPadding = PaddingValues(horizontal = 20.dp),
                  horizontalArrangement = Arrangement.spacedBy(8.dp)
              ) {
                  items(genres) { genre ->
                      Surface(
                          shape = RoundedCornerShape(20.dp),
                          color = Card
                      ) {
                          Text(
                              genre,
                              color = White,
                              fontSize = 12.sp,
                              modifier = Modifier.padding(
                                  horizontal = 14.dp,
                                  vertical = 9.dp
                              )
                          )
                      }
                  }
              }
          }

          @Composable
          fun SearchMovieCard(
              movie: Movie,
              onClick: () -> Unit
          ) {
              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(horizontal = 20.dp, vertical = 7.dp)
                      .clip(RoundedCornerShape(15.dp))
                      .background(Card)
                      .clickable { onClick() }
                      .padding(12.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(
                      modifier = Modifier
                          .width(90.dp)
                          .height(115.dp)
                          .clip(RoundedCornerShape(10.dp))
                          .background(Color(0xFF292929)),
                      contentAlignment = Alignment.Center
                  ) {
                      Icon(
                          Icons.Default.Movie,
                          null,
                          tint = Gold,
                          modifier = Modifier.size(32.dp)
                      )
                  }

                  Spacer(Modifier.width(14.dp))

                  Column(modifier = Modifier.weight(1f)) {
                      Text(
                          movie.title,
                          color = White,
                          fontSize = 16.sp,
                          fontWeight = FontWeight.Bold
                      )

                      Spacer(Modifier.height(5.dp))

                      Text(
                          "${movie.year} • ${movie.genre}",
                          color = Grey,
                          fontSize = 11.sp
                      )

                      Spacer(Modifier.height(7.dp))

                      Text(
                          movie.description,
                          color = Grey,
                          fontSize = 11.sp,
                          maxLines = 2,
                          overflow = TextOverflow.Ellipsis
                      )

                      Spacer(Modifier.height(8.dp))

                      if (movie.free) {
                          Text(
                              "FREE • DOWNLOADABLE",
                              color = Gold,
                              fontSize = 9.sp,
                              fontWeight = FontWeight.Bold
                          )
                      }
                  }
              }
          }

          @Composable
          fun DetailsScreen(
              movie: Movie,
              saved: Boolean,
              onBack: () -> Unit,
              onSave: () -> Unit
          ) {
              LazyColumn(
                  modifier = Modifier.fillMaxSize(),
                  contentPadding = PaddingValues(bottom = 40.dp)
              ) {
                  item {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(14.dp),
                          horizontalArrangement = Arrangement.SpaceBetween
                      ) {
                          IconButton(onClick = onBack) {
                              Icon(
                                  Icons.Default.ArrowBack,
                                  null,
                                  tint = White
                              )
                          }

                          IconButton(onClick = onSave) {
                              Icon(
                                  if (saved) Icons.Default.Favorite
                                  else Icons.Default.FavoriteBorder,
                                  null,
                                  tint = Gold
                              )
                          }
                      }
                  }

                  item {
                      Box(
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(300.dp)
                              .padding(horizontal = 20.dp)
                              .clip(RoundedCornerShape(22.dp))
                              .background(Card),
                          contentAlignment = Alignment.Center
                      ) {
                          Icon(
                              Icons.Default.Movie,
                              null,
                              tint = Gold,
                              modifier = Modifier.size(80.dp)
                          )
                      }
                  }

                  item {
                      Column(
                          modifier = Modifier.padding(20.dp)
                      ) {
                          if (movie.free) {
                              Text(
                                  "FREE • LEGAL DOWNLOAD",
                                  color = Gold,
                                  fontSize = 10.sp,
                                  fontWeight = FontWeight.Bold,
                                  letterSpacing = 1.sp
                              )

                              Spacer(Modifier.height(8.dp))
                          }

                          Text(
                              movie.title,
                              color = White,
                              fontSize = 30.sp,
                              fontWeight = FontWeight.ExtraBold
                          )

                          Spacer(Modifier.height(7.dp))

                          Text(
                              "${movie.year}  •  ${movie.genre}  •  ${movie.runtime}",
                              color = Grey,
                              fontSize = 12.sp
                          )

                          Spacer(Modifier.height(18.dp))

                          Text(
                              movie.description,
                              color = White.copy(alpha = .85f),
                              fontSize = 14.sp,
                              lineHeight = 22.sp
