          @Composable
          fun TopBar(
              title: String,
              onBack: () -> Unit
          ) {

              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(10.dp),

                  verticalAlignment =
                      Alignment.CenterVertically
              ) {

                  IconButton(
                      onClick = onBack
                  ) {

                      Icon(
                          imageVector = Icons.Default.ArrowBack,
                          contentDescription = "Back",
                          tint = Color.White
                      )
                  }

                  Text(
                      text = title,
                      color = Color.White,
                      fontSize = 25.sp,
                      fontWeight = FontWeight.Bold
                  )
