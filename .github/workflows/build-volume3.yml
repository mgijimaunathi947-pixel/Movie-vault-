          ) {

              Column(
                  modifier = Modifier.fillMaxSize()
              ) {

                  TopBar(
                      title = "More",
                      onBack = onBack
                  )

                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(20.dp)
                  ) {

                      Text(
                          text = "MOVIE VAULT",
