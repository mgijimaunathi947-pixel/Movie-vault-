          @Composable
          fun EmptyState(
              text: String
          ) {

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(30.dp),

                  horizontalAlignment =
                      Alignment.CenterHorizontally,

                  verticalArrangement =
                      Arrangement.Center
              ) {

                  Icon(
                      imageVector = Icons.Default.Download,
                      contentDescription = null,
                      tint = Gold,
                      modifier = Modifier.size(55.dp)
                  )

                  Spacer(
                      modifier = Modifier.height(15.dp)
                  )

                  Text(
                      text = text,
                      color = Muted,
                      fontSize = 15.sp
                  )
              }
          }
          EOF

      # ---------------------------------------------------------
      # BUILD
      # ---------------------------------------------------------

      - name: Build Movie Vault APK
        shell: bash
        run: |
          set -e
          cd MovieVaultV10

          echo "Starting Gradle build..."
          gradle assembleDebug --no-daemon

      # ---------------------------------------------------------
      # VERIFY APK
      # ---------------------------------------------------------

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="MovieVaultV10/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      # ---------------------------------------------------------
      # UPLOAD APK
      # ---------------------------------------------------------

      - name: Upload Movie Vault APK
        uses: actions/upload-artifact@v4
        with:
          name: MovieVault-Volume10-APK
          path: MovieVaultV10/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
