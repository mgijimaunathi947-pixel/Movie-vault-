name: Build MovieVault Volume 2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Create project
        run: |
          mkdir -p MovieVaultV2/app/src/main/java/com/movievault/v2
          mkdir -p MovieVaultV2/app/src/main/res/values
         
          cat > MovieVaultV2/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          EOF
          
          cat > MovieVaultV2/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MovieVaultV2"
          include(":app")
          EOF

          cat > MovieVaultV2/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF
EOF

          cat > MovieVaultV2/app/build.gradle.kts <<'EOF'
          plugins {plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    id("org.jetbrains.kotlin.plugin.compose")
}

android {
    namespace = "com.movievault.v2"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.movievault.v2"
        minSdk = 24
        targetSdk = 35
        versionCode = 2
        versionName = "2.0"
    }
}

dependencies {
    implementation(platform("androidx.compose:compose-bom:2024.12.01"))
    implementation("androidx.activity:activity-compose:1.10.0")
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.ui:ui-tooling-preview")
    implementation("androidx.compose.material3:material3")
    implementation("androidx.compose.material:material-icons-extended")
    debugImplementation("androidx.compose.ui:ui-tooling")
}
          EOF

          cat > MovieVaultV2/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.MovieVault" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0D0D0D</item>
                  <item name="android:navigationBarColor">#0D0D0D</item>
              </style>
          </resources>
          EOF

          cat > MovieVaultV2/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Movie Vault"
                  android:theme="@style/Theme.MovieVault">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > MovieVaultV2/app/src/main/java/com/movievault/v2/MainActivity.kt <<'EOF'
          package com.movievault.v2

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          private val Black = Color(0xFF0D0D0D)
          private val Charcoal = Color(0xFF171717)
          private val Card = Color(0xFF202020)
          private val Gold = Color(0xFFD4AF37)
          private val White = Color(0xFFF5F5F5)
          private val Grey = Color(0xFFAAAAAA)

          data class Movie(
              val title: String,
              val year: String,
              val genre: String,
              val runtime: String,
              val description: String,
              val free: Boolean = false
          )

          private val movieList = listOf(
              Movie("Big Buck Bunny","2008","Animation • Comedy","10 min",
                  "A giant rabbit gets into trouble after three mischievous rodents disturb his peaceful day.",true),
              Movie("Sintel","2010","Fantasy • Animation","15 min",
                  "A young warrior begins a journey to find a dragon she has raised from a hatchling.",true),
              Movie("Tears of Steel","2012","Sci-Fi • Drama","12 min",
                  "A group of scientists and soldiers attempt to save Amsterdam from a dangerous robotic threat.",true),
              Movie("The Dark Knight","2008","Action • Crime","152 min",
                  "A masked hero faces a criminal mastermind who pushes Gotham into chaos."),
              Movie("Titanic","1997","Drama • Romance","195 min",
                  "A romance unfolds aboard the legendary ocean liner during its maiden voyage."),
              Movie("Avatar","2009","Sci-Fi • Fantasy","162 min",
                  "A marine on an alien world becomes caught between two very different ways of life."),
              Movie("Black Panther","2018","Action • Fantasy","134 min",
                  "A new king must protect his nation while confronting a powerful challenger.")
          )

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { MovieVaultApp() }
              }
          }

          @Composable
          fun MovieVaultApp() {
              var screen by remember { mutableStateOf("home") }
              var selected by remember { mutableStateOf<Movie?>(null) }
              var search by remember { mutableStateOf("") }
              var saved by remember { mutableStateOf(setOf<String>()) }

              MaterialTheme(
                  colorScheme = darkColorScheme(
                      primary = Gold,
                      background = Black,
                      surface = Charcoal,
                      onPrimary = Black,
                      onBackground = White,
                      onSurface = White
                  )
              ) {
                  Surface(Modifier.fillMaxSize(), color = Black) {
                      if (selected != null) {
                          DetailsScreen(
                              movie = selected!!,
                              isSaved = saved.contains(selected!!.title),
                              onBack = { selected = null },
                              onSave = {
                                  saved =
                                      if (saved.contains(selected!!.title))
                                          saved - selected!!.title
                                      else
                                          saved + selected!!.title
                              }
                          )
                      } else {
                          Column(Modifier.fillMaxSize()) {
                              Box(Modifier.weight(1f)) {
                                  when (screen) {
                                      "home" -> HomeScreen { selected = it }
                                      "search" -> SearchScreen(search, { search = it }) { selected = it }
                                      "list" -> MyListScreen(movieList.filter { saved.contains(it.title) }) { selected = it }
                                      "downloads" -> DownloadsScreen { screen = "home" }
                                      "more" -> MoreScreen(
                                          onBrowse = { screen = "browse" },
                                          onAbout = { screen = "about" }
                                      )
                                      "browse" -> BrowseScreen { selected = it }
                                      "about" -> AboutScreen()
                                  }
                              }
                              BottomBar(screen) { screen = it }
                          }
                      }
                  }
              }
          }

          @Composable
          fun Header(title: String = "MOVIE VAULT") {
              Row(
                  Modifier.fillMaxWidth().padding(20.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.SpaceBetween
              ) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Box(
                          Modifier.size(42.dp).clip(RoundedCornerShape(12.dp)).background(Gold),
                          contentAlignment = Alignment.Center
                      ) {
                          Icon(Icons.Default.Lock, null, tint = Black)
                      }
                      Spacer(Modifier.width(12.dp))
                      Column {
                          Text(title, color = White, fontSize = 18.sp,
                              fontWeight = FontWeight.Bold, letterSpacing = 2.sp)
                          Text("YOUR CINEMA SPACE", color = Gold, fontSize = 8.sp,
                              letterSpacing = 2.sp)
                      }
                  }
              }
          }

          @Composable
          fun HomeScreen(onMovie: (Movie) -> Unit) {
              LazyColumn(contentPadding = PaddingValues(bottom = 25.dp)) {
                  item { Header() }
                  item {
                      Hero(movieList[0]) { onMovie(movieList[0]) }
                  }
                  item { Section("🔥 TRENDING NOW") }
                  item { MovieRow(movieList.drop(3).take(4), onMovie) }
                  item { Section("MOVIE VAULT PICKS") }
                  item { MovieRow(movieList.take(3), onMovie) }
                  item { Section("⬇ FREE & LEGAL DOWNLOADS") }
                  item { MovieRow(movieList.filter { it.free }, onMovie) }
              }
          }

          @Composable
          fun Hero(movie: Movie, onClick: () -> Unit) {
              Box(
                  Modifier.fillMaxWidth().height(320.dp).padding(horizontal = 16.dp)
                      .clip(RoundedCornerShape(22.dp)).background(Card)
                      .clickable { onClick() }
              ) {
                  Column(
                      Modifier.fillMaxSize().padding(24.dp),
                      verticalArrangement = Arrangement.Bottom
                  ) {
                      Text("FEATURED", color = Gold, fontSize = 10.sp,
                          fontWeight = FontWeight.Bold, letterSpacing = 2.sp)
                      Spacer(Modifier.height(8.dp))
                      Text(movie.title, color = White, fontSize = 32.sp,
                          fontWeight = FontWeight.ExtraBold)
                      Text("${movie.year} • ${movie.genre}", color = Grey, fontSize = 12.sp)
                      Spacer(Modifier.height(8.dp))
                      Text(movie.description, color = White.copy(alpha = .8f),
                          fontSize = 12.sp, maxLines = 2)
                      Spacer(Modifier.height(15.dp))
                      Row {
                          GoldButton("WATCH", Icons.Default.PlayArrow, onClick)
                          Spacer(Modifier.width(8.dp))
                          OutlinedButton(onClick = onClick) {
                              Icon(Icons.Default.Add, null)
                              Spacer(Modifier.width(4.dp))
                              Text("MY LIST")
                          }
                      }
                  }
              }
          }

          @Composable
          fun Section(text: String) {
              Text(text, Modifier.padding(start = 20.dp, top = 28.dp, bottom = 14.dp),
                  color = White, fontSize = 15.sp, fontWeight = FontWeight.Bold,
                  letterSpacing = 1.sp)
          }

          @Composable
          fun MovieRow(list: List<Movie>, onMovie: (Movie) -> Unit) {
              LazyRow(
                  contentPadding = PaddingValues(horizontal = 20.dp),
                  horizontalArrangement = Arrangement.spacedBy(14.dp)
              ) {
                  items(list) { movie ->
                      MovieCard(movie) { onMovie(movie) }
                  }
              }
          }

          @Composable
          fun MovieCard(movie: Movie, onClick: () -> Unit) {
              Column(Modifier.width(145.dp).clickable { onClick() }) {
                  Box(
                      Modifier.fillMaxWidth().height(200.dp)
                          .clip(RoundedCornerShape(14.dp)).background(Card),
                      contentAlignment = Alignment.Center
                  ) {
                      Icon(Icons.Default.Movie, null, tint = Gold,
                          modifier = Modifier.size(42.dp))
                      if (movie.free) {
                          Surface(
                              Modifier.align(Alignment.TopStart).padding(8.dp),
                              shape = RoundedCornerShape(5.dp), color = Gold
                          ) {
                              Text("FREE", color = Black, fontSize = 8.sp,
                                  fontWeight = FontWeight.Bold,
                                  modifier = Modifier.padding(6.dp))
                          }
                      }
                  }
                  Spacer(Modifier.height(7.dp))
                  Text(movie.title, color = White, fontSize = 12.sp,
                      fontWeight = FontWeight.Bold, maxLines = 1,
                      overflow = TextOverflow.Ellipsis)
                  Text("${movie.year} • ${movie.genre.split(" • ")[0]}",
                      color = Grey, fontSize = 10.sp)
              }
          }

          @Composable
          fun SearchScreen(
              query: String,
              onQuery: (String) -> Unit,
              onMovie: (Movie) -> Unit
          ) {
              val results = if (query.isBlank()) movieList else movieList.filter {
                  it.title.contains(query, true) ||
                  it.genre.contains(query, true) ||
                  it.year.contains(query)
              }

              LazyColumn(contentPadding = PaddingValues(bottom = 25.dp)) {
                  item { Header("SEARCH MOVIE VAULT") }
                  item {
                      OutlinedTextField(
                          value = query,
                          onValueChange = onQuery,
                          modifier = Modifier.fillMaxWidth().padding(horizontal = 20.dp),
                          placeholder = { Text("Search movies, actors, genres...", color = Grey) },
                          leadingIcon = { Icon(Icons.Default.Search, null, tint = Gold) },
                          singleLine = true,
                          shape = RoundedCornerShape(14.dp),
                          colors = OutlinedTextFieldDefaults.colors(
                              focusedBorderColor = Gold,
                              unfocusedBorderColor = Color.DarkGray,
                              focusedTextColor = White,
                              unfocusedTextColor = White
                          )
                      )
                  }
                  item {
                      Section(if (query.isBlank()) "BROWSE BY GENRE"
                              else "RESULTS FOR \"$query\"")
                  }
                  if (query.isBlank()) {
                      item { Genres() }
                      item { Section("POPULAR SEARCHES") }
                      item {
                          Text(
                              "The Dark Knight   •   Titanic   •   Spider-Man\nAvatar   •   Black Panther",
                              Modifier.padding(horizontal = 20.dp),
                              color = Grey, lineHeight = 28.sp
                          )
                      }
                  }
                  items(results) { movie ->
                      SearchCard(movie) { onMovie(movie) }
                  }
              }
          }

          @Composable
          fun Genres() {
              LazyRow(
                  contentPadding = PaddingValues(horizontal = 20.dp),
                  horizontalArrangement = Arrangement.spacedBy(8.dp)
              ) {
                  items(listOf("Action","Comedy","Drama","Horror","Romance","Sci-Fi","Animation","Thriller","Documentary")) {
                      Surface(shape = RoundedCornerShape(20.dp), color = Card) {
                          Text(it, color = White, fontSize = 11.sp,
                              modifier = Modifier.padding(horizontal = 14.dp, vertical = 9.dp))
                      }
                  }
              }
          }

          @Composable
          fun SearchCard(movie: Movie, onClick: () -> Unit) {
              Row(
                  Modifier.fillMaxWidth().padding(horizontal = 20.dp, vertical = 6.dp)
                      .clip(RoundedCornerShape(15.dp)).background(Card)
                      .clickable { onClick() }.padding(12.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(
                      Modifier.width(85.dp).height(110.dp)
                          .clip(RoundedCornerShape(10.dp)).background(Color(0xFF292929)),
                      contentAlignment = Alignment.Center
                  ) {
                      Icon(Icons.Default.Movie, null, tint = Gold,
                          modifier = Modifier.size(30.dp))
                  }
                  Spacer(Modifier.width(13.dp))
                  Column(Modifier.weight(1f)) {
                      Text(movie.title, color = White, fontSize = 16.sp,
                          fontWeight = FontWeight.Bold)
                      Text("${movie.year} • ${movie.genre}", color = Grey, fontSize = 10.sp)
                      Spacer(Modifier.height(6.dp))
                      Text(movie.description, color = Grey, fontSize = 10.sp,
                          maxLines = 2, overflow = TextOverflow.Ellipsis)
                      if (movie.free) {
                          Spacer(Modifier.height(5.dp))
                          Text("FREE • DOWNLOADABLE", color = Gold,
                              fontSize = 8.sp, fontWeight = FontWeight.Bold)
                      }
                  }
              }
          }

          @Composable
          fun DetailsScreen(
              movie: Movie,
              isSaved: Boolean,
              onBack: () -> Unit,
              onSave: () -> Unit
          ) {
              LazyColumn(contentPadding = PaddingValues(bottom = 30.dp)) {
                  item {
                      Row(
                          Modifier.fillMaxWidth().padding(12.dp),
                          horizontalArrangement = Arrangement.SpaceBetween
                      ) {
                          IconButton(onClick = onBack) {
                              Icon(Icons.Default.ArrowBack, null, tint = White)
                          }
                          IconButton(onClick = onSave) {
                              Icon(
                                  if (isSaved) Icons.Default.Favorite
                                  else Icons.Default.FavoriteBorder,
                                  null, tint = Gold
                              )
                          }
                      }
                  }
                  item {
                      Box(
                          Modifier.fillMaxWidth().height(290.dp).padding(horizontal = 20.dp)
                              .clip(RoundedCornerShape(22.dp)).background(Card),
                          contentAlignment = Alignment.Center
                      ) {
                          Icon(Icons.Default.Movie, null, tint = Gold,
                              modifier = Modifier.size(80.dp))
                      }
                  }
                  item {
                      Column(Modifier.padding(20.dp)) {
                          if (movie.free) {
                              Text("FREE • LEGAL DOWNLOAD", color = Gold,
                                  fontSize = 10.sp, fontWeight = FontWeight.Bold)
                              Spacer(Modifier.height(7.dp))
                          }
                          Text(movie.title, color = White, fontSize = 29.sp,
                              fontWeight = FontWeight.ExtraBold)
                          Text("${movie.year} • ${movie.genre} • ${movie.runtime}",
                              color = Grey, fontSize = 11.sp)
                          Spacer(Modifier.height(18.dp))
                          Text(movie.description, color = White.copy(alpha = .85f),
                              fontSize = 13.sp, lineHeight = 21.sp)
                          Spacer(Modifier.height(20.dp))
                          Row {
                              GoldButton("WATCH NOW", Icons.Default.PlayArrow) {}
                              if (movie.free) {
                                  Spacer(Modifier.width(8.dp))
                                  OutlinedButton(onClick = {}) {
                                      Icon(Icons.Default.Download, null)
                                      Spacer(Modifier.width(4.dp))
                                      Text("DOWNLOAD")
                                  }
                              }
                          }
                          Spacer(Modifier.height(25.dp))
                          Text("AVAILABLE ON", color = Gold, fontSize = 10.sp,
                              fontWeight = FontWeight.Bold, letterSpacing = 1.sp)
                          Spacer(Modifier.height(9.dp))
                          Surface(Modifier.fillMaxWidth(), color = Card,
                              shape = RoundedCornerShape(12.dp)) {
                              Text(
                                  if (movie.free) "Legal free-download source"
                                  else "Availability depends on region and provider",
                                  color = White, fontSize = 12.sp,
                                  modifier = Modifier.padding(15.dp)
                              )
                          }
                          Spacer(Modifier.height(25.dp))
                          Text("ABOUT THIS MOVIE", color = Gold, fontSize = 10.sp,
                              fontWeight = FontWeight.Bold, letterSpacing = 1.sp)
                          Info("Year", movie.year)
                          Info("Genre", movie.genre)
                          Info("Runtime", movie.runtime)
                          Info("Language", "Original language")
                          Spacer(Modifier.height(22.dp))
                          Text("YOU MAY ALSO LIKE", color = Gold, fontSize = 10.sp,
                              fontWeight = FontWeight.Bold, letterSpacing = 1.sp)
                      }
                  }
                  item {
                      MovieRow(movieList.filter { it.title != movie.title }.take(4)) {}
                  }
              }
          }

          @Composable
          fun Info(label: String, value: String) {
              Row(
                  Modifier.fillMaxWidth().padding(vertical = 6.dp),
                  horizontalArrangement = Arrangement.SpaceBetween
              ) {
                  Text(label, color = Grey, fontSize = 12.sp)
                  Text(value, color = White, fontSize = 12.sp)
              }
          }

          @Composable
          fun MyListScreen(list: List<Movie>, onMovie: (Movie) -> Unit) {
              LazyColumn(contentPadding = PaddingValues(bottom = 25.dp)) {
                  item { Header() }
                  item {
                      Text("MY LIST", Modifier.padding(horizontal = 20.dp),
                          color = White, fontSize = 28.sp, fontWeight = FontWeight.ExtraBold)
                      Text("SAVED MOVIES", Modifier.padding(20.dp),
                          color = Gold, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                  }
                  if (list.isEmpty()) {
                      item {
                          Empty(Icons.Default.Lock, "Your vault is empty.",
                              "Save movies here and they'll be waiting for you.")
                      }
                  } else {
                      items(list) { SearchCard(it) { onMovie(it) } }
                  }
              }
          }

          @Composable
          fun DownloadsScreen(onExplore: () -> Unit) {
              Column(Modifier.fillMaxSize()) {
                  Header()
                  Text("DOWNLOADS", Modifier.padding(horizontal = 20.dp),
                      color = White, fontSize = 28.sp, fontWeight = FontWeight.ExtraBold)
                  Text("YOUR OFFLINE MOVIES", Modifier.padding(20.dp),
                      color = Gold, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                  Empty(Icons.Default.Download, "Your offline vault is empty",
                      "Download movies that are legally available for offline viewing and they'll appear here.",
                      onExplore)
                  Surface(
                      Modifier.fillMaxWidth().padding(20.dp),
                      color = Card, shape = RoundedCornerShape(16.dp)
                  ) {
                      Column(Modifier.padding(18.dp)) {
                          Text("STORAGE", color = Gold, fontSize = 10.sp,
                              fontWeight = FontWeight.Bold)
                          Spacer(Modifier.height(7.dp))
                          Text("0 MB used / Storage available", color = White, fontSize = 12.sp)
                      }
                  }
              }
          }

          @Composable
          fun BrowseScreen(onMovie: (Movie) -> Unit) {
              LazyColumn(contentPadding = PaddingValues(bottom = 25.dp)) {
                  item { Header("BROWSE") }
                  item {
                      Text("WHAT ARE YOU IN THE MOOD FOR?",
                          Modifier.padding(horizontal = 20.dp),
                          color = White, fontSize = 19.sp, fontWeight = FontWeight.Bold)
                  }
                  item { GenreGrid() }
                  item { Section("POPULAR THIS WEEK") }
                  item { MovieRow(movieList.take(4), onMovie) }
                  item { Section("FREE & LEGAL") }
                  item { MovieRow(movieList.filter { it.free }, onMovie) }
              }
          }

          @Composable
          fun GenreGrid() {
              Column(Modifier.padding(20.dp)) {
                  listOf(
                      "ACTION","COMEDY","ROMANCE","HORROR","SCI-FI",
                      "FANTASY","DRAMA","THRILLER","ANIMATION","DOCUMENTARY"
                  ).chunked(2).forEach { row ->
                      Row(Modifier.fillMaxWidth()) {
                          row.forEach {
                              Surface(
                                  Modifier.weight(1f).height(68.dp).padding(4.dp),
                                  color = Card, shape = RoundedCornerShape(13.dp)
                              ) {
                                  Box(contentAlignment = Alignment.Center) {
                                      Text(it, color = White, fontSize = 10.sp,
                                          fontWeight = FontWeight.Bold, letterSpacing = 1.sp)
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun MoreScreen(onBrowse: () -> Unit, onAbout: () -> Unit) {
              LazyColumn(contentPadding = PaddingValues(bottom = 25.dp)) {
                  item { Header("MORE") }
                  item {
                      Text("MOVIE VAULT", Modifier.padding(horizontal = 20.dp),
                          color = White, fontSize = 28.sp, fontWeight = FontWeight.ExtraBold)
                  }
                  item {
                      Spacer(Modifier.height(15.dp))
                      Menu("My Account", Icons.Default.Person)
                      Menu("Notifications", Icons.Default.Notifications)
                      Menu("Appearance", Icons.Default.DarkMode)
                      Menu("Download Settings", Icons.Default.Download)
                      Menu("Playback Settings", Icons.Default.PlayCircle)
                      Menu("Legal & Sources", Icons.Default.Info)
                      Menu("Privacy", Icons.Default.Lock)
                      Menu("Terms of Use", Icons.Default.Description)
                      Menu("Browse Categories", Icons.Default.Category, onBrowse)
                      Menu("About Movie Vault", Icons.Default.Movie, onAbout)
                  }
                  item {
                      Spacer(Modifier.height(25.dp))
                      Text("MOVIE VAULT", Modifier.fillMaxWidth(),
                          color = Gold, fontSize = 10.sp, textAlign = TextAlign.Center,
                          letterSpacing = 2.sp)
                      Text("Version 2.0", Modifier.fillMaxWidth(),
                          color = Grey, fontSize = 9.sp, textAlign = TextAlign.Center)
                  }
              }
          }

          @Composable
          fun Menu(text: String, icon: androidx.compose.ui.graphics.vector.ImageVector,
                   onClick: () -> Unit = {}) {
              Row(
                  Modifier.fillMaxWidth().padding(horizontal = 20.dp, vertical = 3.dp)
                      .clip(RoundedCornerShape(13.dp)).background(Card)
                      .clickable { onClick() }.padding(15.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Icon(icon, null, tint = Gold)
                  Spacer(Modifier.width(14.dp))
                  Text(text, color = White, fontSize = 13.sp,
                      modifier = Modifier.weight(1f))
                  Icon(Icons.Default.ChevronRight, null, tint = Grey)
              }
          }

          @Composable
          fun AboutScreen() {
