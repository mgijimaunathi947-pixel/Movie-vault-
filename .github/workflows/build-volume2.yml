name: Build MovieVault Volume 2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Create project
        run: |
          mkdir -p MovieVaultV2/app/src/main/java/com/movievault/v2
          mkdir -p MovieVaultV2/app/src/main/res/values

          cat > MovieVaultV2/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          EOF

          cat > MovieVaultV2/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MovieVaultV2"
          include(":app")
          EOF

          cat > MovieVaultV2/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > MovieVaultV2/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.movievault.v2"
              compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              defaultConfig {
                  applicationId = "com.movievault.v2"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.0"
              }
          }

          kotlin {
              jvmToolchain(17)
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

          cat > MovieVaultV2/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.MovieVault" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0D0D0D</item>
                  <item name="android:navigationBarColor">#0D0D0D</item>
              </style>
          </resources>
          EOF

          cat > MovieVaultV2/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Movie Vault"
                  android:theme="@style/Theme.MovieVault">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > MovieVaultV2/app/src/main/java/com/movievault/v2/MainActivity.kt <<'EOF'
          package com.movievault.v2

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          private val Black = Color(0xFF0D0D0D)
          private val Charcoal = Color(0xFF171717)
          private val Card = Color(0xFF202020)
          private val Gold = Color(0xFFD4AF37)
          private val White = Color(0xFFF5F5F5)
          private val Grey = Color(0xFFAAAAAA)

          data class Movie(
              val title: String,
              val year: String,
              val genre: String,
              val runtime: String,
              val description: String,
              val free: Boolean = false
          )

          private val movies = listOf(
              Movie(
                  "Big Buck Bunny",
                  "2008",
                  "Animation",
                  "10 min",
                  "A colourful animated short about a gentle giant rabbit and his forest friends.",
                  true
              ),
              Movie(
                  "Sintel",
                  "2010",
                  "Fantasy",
                  "15 min",
                  "An adventurous fantasy short following a young woman searching for a lost dragon.",
                  true
              ),
              Movie(
                  "Tears of Steel",
                  "2012",
                  "Sci-Fi",
                  "12 min",
                  "A futuristic science-fiction short combining live action with visual effects.",
                  true
              ),
              Movie(
                  "The Dark Knight",
                  "2008",
                  "Action",
                  "152 min",
                  "A masked hero faces a dangerous criminal mastermind in Gotham City."
              ),
              Movie(
                  "Titanic",
                  "1997",
                  "Drama",
                  "195 min",
                  "A romantic drama set aboard the famous ocean liner."
              ),
              Movie(
                  "Avatar",
                  "2009",
                  "Sci-Fi",
                  "162 min",
                  "A marine explores the extraordinary world of Pandora."
              ),
              Movie(
                  "Black Panther",
                  "2018",
                  "Action",
                  "134 min",
                  "A new king must protect his nation while confronting a powerful challenger."
              )
          )

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MovieVaultApp()
                  }
              }
          }

          @Composable
          fun MovieVaultApp() {
              var selectedTab by remember { mutableStateOf("Home") }
              var selectedMovie by remember { mutableStateOf<Movie?>(null) }

              MaterialTheme(
                  colorScheme = darkColorScheme(
                      background = Black,
                      surface = Charcoal,
                      primary = Gold,
                      onPrimary = Black,
                      onBackground = White,
                      onSurface = White
                  )
              ) {
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(Black)
                  ) {
                      if (selectedMovie != null) {
                          DetailsScreen(
                              movie = selectedMovie!!,
                              onBack = { selectedMovie = null }
                          )
                      } else {
                          Scaffold(
                              containerColor = Black,
                              bottomBar = {
                                  BottomBar(
                                      selected = selectedTab,
                                      onSelected = { selectedTab = it }
                                  )
                              }
                          ) { padding ->
                              Box(
                                  modifier = Modifier
                                      .fillMaxSize()
                                      .padding(padding)
                              ) {
                                  when (selectedTab) {
                                      "Home" -> HomeScreen(
                                          onMovieClick = { selectedMovie = it }
                                      )
                                      "Search" -> SearchScreen(
                                          onMovieClick = { selectedMovie = it }
                                      )
                                      "My List" -> MyListScreen()
                                      "Downloads" -> DownloadsScreen()
                                      "More" -> MoreScreen()
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun Header() {
              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(horizontal = 20.dp, vertical = 18.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(
                      modifier = Modifier
                          .size(42.dp)
                          .clip(RoundedCornerShape(12.dp))
                          .background(Gold),
                      contentAlignment = Alignment.Center
                  ) {
                      Icon(
                          Icons.Default.Lock,
                          contentDescription = null,
                          tint = Black
                      )
                  }

                  Spacer(Modifier.width(12.dp))

                  Column {
                      Text(
                          "MOVIE",
                          color = Gold,
                          fontSize = 18.sp,
                          fontWeight = FontWeight.Bold,
                          letterSpacing = 3.sp
                      )
                      Text(
                          "VAULT",
                          color = White,
                          fontSize = 18.sp,
                          fontWeight = FontWeight.Bold,
                          letterSpacing = 3.sp
                      )
                  }

                  Spacer(Modifier.weight(1f))

                  IconButton(onClick = {}) {
                      Icon(
                          Icons.Default.NotificationsNone,
                          contentDescription = "Notifications",
                          tint = White
                      )
                  }
              }
          }

          @Composable
          fun HomeScreen(onMovieClick: (Movie) -> Unit) {
              LazyColumn(
                  modifier = Modifier.fillMaxSize(),
                  contentPadding = PaddingValues(bottom = 20.dp)
              ) {
                  item {
                      Header()
                  }

                  item {
                      Hero(onClick = {
                          onMovieClick(movies[0])
                      })
                  }

                  item {
                      SectionTitle("Continue Watching")
                  }

                  item {
                      MovieRow(
                          movies = movies.take(3),
                          onMovieClick = onMovieClick
                      )
                  }

                  item {
                      SectionTitle("Free & Legal")
                  }

                  item {
                      MovieRow(
                          movies = movies.filter { it.free },
                          onMovieClick = onMovieClick
                      )
                  }

                  item {
                      SectionTitle("Popular Movies")
                  }

                  item {
                      MovieRow(
                          movies = movies.drop(3),
                          onMovieClick = onMovieClick
                      )
                  }
              }
          }

          @Composable
          fun Hero(onClick: () -> Unit) {
              Box(
                  modifier = Modifier
                      .fillMaxWidth()
                      .height(240.dp)
                      .padding(horizontal = 16.dp)
                      .clip(RoundedCornerShape(22.dp))
                      .background(Card)
                      .clickable { onClick() }
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(24.dp),
                      verticalArrangement = Arrangement.Bottom
                  ) {
                      Text(
                          "FEATURED",
                          color = Gold,
                          fontSize = 12.sp,
                          fontWeight = FontWeight.Bold,
                          letterSpacing = 2.sp
                      )

                      Spacer(Modifier.height(8.dp))

                      Text(
                          "Big Buck Bunny",
                          color = White,
                          fontSize = 28.sp,
                          fontWeight = FontWeight.Bold
                      )

                      Text(
                          "Animation  •  2008  •  10 min",
                          color = Grey,
                          fontSize = 13.sp
                      )

                      Spacer(Modifier.height(14.dp))

                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Button(
                              onClick = onClick,
                              colors = ButtonDefaults.buttonColors(
                                  containerColor = Gold,
                                  contentColor = Black
                              )
                          ) {
                              Icon(Icons.Default.PlayArrow, null)
                              Spacer(Modifier.width(6.dp))
                              Text("Watch")
                          }

                          Spacer(Modifier.width(10.dp))

                          OutlinedButton(
                              onClick = onClick,
                              colors = ButtonDefaults.outlinedButtonColors(
                                  contentColor = White
                              )
                          ) {
                              Icon(Icons.Default.Add, null)
                              Spacer(Modifier.width(6.dp))
                              Text("My List")
                          }
                      }
                  }
              }

              Spacer(Modifier.height(8.dp))
          }

          @Composable
          fun SectionTitle(title: String) {
              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(horizontal = 20.dp, vertical = 16.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Text(
                      title,
                      color = White,
                      fontSize = 19.sp,
                      fontWeight = FontWeight.Bold
                  )

                  Spacer(Modifier.weight(1f))

                  Text(
                      "See all",
                      color = Gold,
                      fontSize = 13.sp
                  )
              }
          }

          @Composable
          fun MovieRow(
              movies: List<Movie>,
              onMovieClick: (Movie) -> Unit
          ) {
              LazyRow(
                  contentPadding = PaddingValues(horizontal = 16.dp),
                  horizontalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  items(movies) { movie ->
                      MovieCard(
                          movie = movie,
                          onClick = { onMovieClick(movie) }
                      )
                  }
              }
          }

          @Composable
          fun MovieCard(
              movie: Movie,
              onClick: () -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .width(145.dp)
                      .clickable { onClick() }
              ) {
                  Box(
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(185.dp)
                          .clip(RoundedCornerShape(14.dp))
                          .background(Card),
                      contentAlignment = Alignment.Center
                  ) {
                      Icon(
                          Icons.Default.Movie,
                          contentDescription = null,
                          tint = Gold,
                          modifier = Modifier.size(42.dp)
                      )

                      if (movie.free) {
                          Surface(
                              modifier = Modifier
                                  .align(Alignment.TopStart)
                                  .padding(8.dp),
                              color = Gold,
                              shape = RoundedCornerShape(6.dp)
                          ) {
                              Text(
                                  "FREE",
                                  color = Black,
                                  fontSize = 9.sp,
                                  fontWeight = FontWeight.Bold,
                                  modifier = Modifier.padding(
                                      horizontal = 7.dp,
                                      vertical = 4.dp
                                  )
                              )
                          }
                      }
                  }

                  Spacer(Modifier.height(8.dp))

                  Text(
                      movie.title,
                      color = White,
                      fontSize = 14.sp,
                      fontWeight = FontWeight.SemiBold,
                      maxLines = 1,
                      overflow = TextOverflow.Ellipsis
                  )

                  Text(
                      "${movie.year}  •  ${movie.genre}",
                      color = Grey,
                      fontSize = 11.sp
                  )
              }
          }

          @Composable
          fun SearchScreen(onMovieClick: (Movie) -> Unit) {
              var query by remember { mutableStateOf("") }

              val filtered = movies.filter {
                  it.title.contains(query, ignoreCase = true) ||
                          it.genre.contains(query, ignoreCase = true)
              }

              Column(modifier = Modifier.fillMaxSize()) {
                  Text(
                      "Search",
                      color = White,
                      fontSize = 28.sp,
                      fontWeight = FontWeight.Bold,
                      modifier = Modifier.padding(20.dp)
                  )

                  OutlinedTextField(
                      value = query,
                      onValueChange = { query = it },
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 16.dp),
                      placeholder = {
                          Text("Search movies or genres", color = Grey)
                      },
                      leadingIcon = {
                          Icon(Icons.Default.Search, null, tint = Gold)
                      },
                      singleLine = true,
                      colors = OutlinedTextFieldDefaults.colors(
                          focusedBorderColor = Gold,
                          unfocusedBorderColor = Color.DarkGray,
                          focusedTextColor = White,
                          unfocusedTextColor = White
                      )
                  )

                  Spacer(Modifier.height(16.dp))

                  LazyColumn(
                      contentPadding = PaddingValues(
                          horizontal = 16.dp,
                          vertical = 8.dp
                      ),
                      verticalArrangement = Arrangement.spacedBy(10.dp)
                  ) {
                      items(filtered) { movie ->
                          SearchMovieCard(
                              movie = movie,
                              onClick = { onMovieClick(movie) }
                          )
                      }
                  }
              }
          }

          @Composable
          fun SearchMovieCard(
              movie: Movie,
              onClick: () -> Unit
          ) {
              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .clip(RoundedCornerShape(14.dp))
                      .background(Card)
                      .clickable { onClick() }
                      .padding(12.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(
                      modifier = Modifier
                          .size(72.dp)
                          .clip(RoundedCornerShape(10.dp))
                          .background(Charcoal),
                      contentAlignment = Alignment.Center
                  ) {
                      Icon(
                          Icons.Default.Movie,
                          contentDescription = null,
                          tint = Gold
                      )
                  }

                  Spacer(Modifier.width(14.dp))

                  Column(modifier = Modifier.weight(1f)) {
                      Text(
                          movie.title,
                          color = White,
                          fontWeight = FontWeight.Bold
                      )
                      Text(
                          "${movie.year}  •  ${movie.genre}",
                          color = Grey,
                          fontSize = 12.sp
                      )
                      Text(
                          movie.runtime,
                          color = Grey,
                          fontSize = 12.sp
                      )
                  }

                  Icon(
                      Icons.Default.ChevronRight,
                      contentDescription = null,
                      tint = Gold
                  )
              }
          }

          @Composable
          fun DetailsScreen(
              movie: Movie,
              onBack: () -> Unit
          ) {
              Column(modifier = Modifier.fillMaxSize()) {
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(12.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      IconButton(onClick = onBack) {
                          Icon(
                              Icons.Default.ArrowBack,
                              contentDescription = "Back",
                              tint = White
                          )
                      }

                      Text(
                          "Movie Details",
                          color = White,
                          fontSize = 20.sp,
                          fontWeight = FontWeight.Bold
                      )
                  }

                  LazyColumn(
                      contentPadding = PaddingValues(20.dp)
                  ) {
                      item {
                          Box(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .height(300.dp)
                                  .clip(RoundedCornerShape(22.dp))
                                  .background(Card),
                              contentAlignment = Alignment.Center
                          ) {
                              Icon(
                                  Icons.Default.Movie,
                                  contentDescription = null,
                                  tint = Gold,
                                  modifier = Modifier.size(70.dp)
                              )
                          }

                          Spacer(Modifier.height(22.dp))

                          Text(
                              movie.title,
                              color = White,
                              fontSize = 30.sp,
                              fontWeight = FontWeight.Bold
                          )

                          Spacer(Modifier.height(6.dp))

                          Text(
                              "${movie.year}  •  ${movie.genre}  •  ${movie.runtime}",
                              color = Gold,
                              fontSize = 13.sp
                          )

                          Spacer(Modifier.height(18.dp))

                          Text(
                              movie.description,
                              color = Grey,
                              fontSize = 15.sp,
                              lineHeight = 23.sp
                          )

                          Spacer(Modifier.height(24.dp))

                          Button(
                              onClick = {},
                              modifier = Modifier.fillMaxWidth(),
                              colors = ButtonDefaults.buttonColors(
                                  containerColor = Gold,
                                  contentColor = Black
                              )
                          ) {
                              Icon(Icons.Default.PlayArrow, null)
                              Spacer(Modifier.width(8.dp))
                              Text(
                                  "Watch / Open Legal Source",
                                  fontWeight = FontWeight.Bold
                              )
                          }

                          Spacer(Modifier.height(10.dp))

                          OutlinedButton(
                              onClick = {},
                              modifier = Modifier.fillMaxWidth(),
                              colors = ButtonDefaults.outlinedButtonColors(
                                  contentColor = White
                              )
                          ) {
                              Icon(Icons.Default.Add, null)
                              Spacer(Modifier.width(8.dp))
                              Text("Add to My List")
                          }

                          if (movie.free) {
                              Spacer(Modifier.height(18.dp))

                              Text(
                                  "FREE & LEGAL",
                                  color = Gold,
                                  fontWeight = FontWeight.Bold,
                                  fontSize = 12.sp
                              )

                              Text(
                                  "This title is marked as available from a legal free source. Actual playback and downloads can be connected later.",
                                  color = Grey,
                                  fontSize = 12.sp
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          fun MyListScreen() {
              EmptyScreen(
                  icon = Icons.Default.BookmarkBorder,
                  title = "Your List Is Empty",
                  message = "Movies you save will appear here."
              )
          }

          @Composable
          fun DownloadsScreen() {
              EmptyScreen(
                  icon = Icons.Default.Download,
                  title = "No Downloads Yet",
                  message = "Legal downloads you start will appear here."
              )
          }

          @Composable
          fun MoreScreen() {
              LazyColumn(
                  modifier = Modifier.fillMaxSize(),
                  contentPadding = PaddingValues(20.dp)
              ) {
                  item {
                      Text(
                          "More",
                          color = White,
                          fontSize = 28.sp,
                          fontWeight = FontWeight.Bold
                      )

                      Spacer(Modifier.height(20.dp))

                      MenuItem(Icons.Default.Category, "Browse Categories")
                      MenuItem(Icons.Default.Settings, "Settings")
                      MenuItem(Icons.Default.Info, "About Movie Vault")
                      MenuItem(Icons.Default.Security, "Privacy & Safety")
                  }
              }
          }

          @Composable
          fun MenuItem(icon: androidx.compose.ui.graphics.vector.ImageVector, title: String) {
              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .clip(RoundedCornerShape(14.dp))
                      .background(Card)
                      .padding(17.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Icon(icon, null, tint = Gold)
                  Spacer(Modifier.width(16.dp))
                  Text(
                      title,
                      color = White,
                      fontSize = 16.sp
                  )
                  Spacer(Modifier.weight(1f))
                  Icon(
                      Icons.Default.ChevronRight,
                      null,
                      tint = Grey
                  )
              }

              Spacer(Modifier.height(10.dp))
          }

          @Composable
          fun EmptyScreen(
              icon: androidx.compose.ui.graphics.vector.ImageVector,
              title: String,
              message: String
          ) {
              Box(
                  modifier = Modifier.fillMaxSize(),
                  contentAlignment = Alignment.Center
              ) {
                  Column(
                      horizontalAlignment = Alignment.CenterHorizontally,
                      modifier = Modifier.padding(40.dp)
                  ) {
                      Icon(
                          icon,
                          contentDescription = null,
                          tint = Gold,
                          modifier = Modifier.size(60.dp)
                      )

                      Spacer(Modifier.height(18.dp))

                      Text(
                          title,
                          color = White,
                          fontSize = 22.sp,
                          fontWeight = FontWeight.Bold
                      )

                      Spacer(Modifier.height(8.dp))

                      Text(
                          message,
                          color = Grey,
                          fontSize = 14.sp
                      )
                  }
              }
          }

          @Composable
          fun BottomBar(
              selected: String,
              onSelected: (String) -> Unit
          ) {
              NavigationBar(
                  containerColor = Charcoal
              ) {
                  val items = listOf(
                      Triple("Home", Icons.Default.Home, "Home"),
                      Triple("Search", Icons.Default.Search, "Search"),
                      Triple("My List", Icons.Default.BookmarkBorder, "My List"),
                      Triple("Downloads", Icons.Default.Download, "Downloads"),
                      Triple("More", Icons.Default.MoreHoriz, "More")
                  )

                  items.forEach { item ->
                      NavigationBarItem(
                          selected = selected == item.first,
                          onClick = { onSelected(item.first) },
                          icon = {
                              Icon(item.second, contentDescription = item.third)
                          },
                          label = {
                              Text(item.third)
                          },
                          colors = NavigationBarItemDefaults.colors(
                              selectedIconColor = Black,
                              selectedTextColor = Gold,
                              indicatorColor = Gold,
                              unselectedIconColor = Grey,
                              unselectedTextColor = Grey
                          )
                      )
                  }
              }
          }
          EOF

          cd MovieVaultV2
          gradle assembleDebug --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: MovieVault-Volume-2-APK
          path: MovieVaultV2/app/build/outputs/apk/debug/*.apk
