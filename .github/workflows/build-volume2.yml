          @Composable
          fun Feature(title: String, text: String) {
              Row(Modifier.fillMaxWidth().padding(vertical = 8.dp),
                  verticalAlignment = Alignment.CenterVertically) {
                  Box(Modifier.size(36.dp).clip(RoundedCornerShape(10.dp)).background(Gold),
                      contentAlignment = Alignment.Center) {
                      Icon(Icons.Default.Check, null, tint = Black)
                  }
                  Spacer(Modifier.width(13.dp))
                  Column {
                      Text(title, color = White, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                      Text(text, color = Grey, fontSize = 10.sp)
                  }
              }
          }

          @Composable
          fun Empty(
              icon: androidx.compose.ui.graphics.vector.ImageVector,
              title: String,
              message: String,
              button: (() -> Unit)? = null
          ) {
              Column(
                  Modifier.fillMaxWidth().padding(35.dp),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Box(Modifier.size(75.dp).clip(RoundedCornerShape(22.dp)).background(Card),
                      contentAlignment = Alignment.Center) {
                      Icon(icon, null, tint = Gold, modifier = Modifier.size(32.dp))
                  }
                  Spacer(Modifier.height(17.dp))
                  Text(title, color = White, fontSize = 17.sp, fontWeight = FontWeight.Bold)
                  Spacer(Modifier.height(7.dp))
                  Text(message, color = Grey, fontSize = 11.sp, lineHeight = 18.sp,
                      textAlign = TextAlign.Center)
                  if (button != null) {
                      Spacer(Modifier.height(17.dp))
                      GoldButton("EXPLORE MOVIES", Icons.Default.Movie, button)
                  }
              }
          }

          @Composable
          fun GoldButton(
              text: String,
              icon: androidx.compose.ui.graphics.vector.ImageVector,
              onClick: () -> Unit
          ) {
              Button(
                  onClick = onClick,
                  colors = ButtonDefaults.buttonColors(
                      containerColor = Gold,
                      contentColor = Black
                  ),
                  shape = RoundedCornerShape(10.dp)
              ) {
                  Icon(icon, null)
                  Spacer(Modifier.width(4.dp))
                  Text(text, fontWeight = FontWeight.Bold, fontSize = 10.sp)
              }
          }

          @Composable
          fun BottomBar(current: String, navigate: (String) -> Unit) {
              val tabs = listOf(
                  Triple("home","Home",Icons.Default.Home),
                  Triple("search","Search",Icons.Default.Search),
                  Triple("list","My List",Icons.Default.Favorite),
                  Triple("downloads","Downloads",Icons.Default.Download),
                  Triple("more","More",Icons.Default.Menu)
              )

              NavigationBar(containerColor = Color(0xFF111111)) {
                  tabs.forEach { (route,label,icon) ->
                      NavigationBarItem(
                          selected = current == route,
                          onClick = { navigate(route) },
                          icon = {
                              Icon(icon, label,
                                  tint = if (current == route) Gold else Grey)
                          },
                          label = {
                              Text(label, fontSize = 8.sp,
                                  color = if (current == route) Gold else Grey)
                          },
                          colors = NavigationBarItemDefaults.colors(
                              indicatorColor = Gold.copy(alpha = .12f)
                          )
                      )
                  }
              }
          }
